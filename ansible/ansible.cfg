# ansible.cfg -- the v2 skeleton (OPS-7) runs from here. Nothing executes
# ansible yet; the inventory + vars are live (the bash scripts parse them).
[defaults]
inventory = ./ansible/inventory/hosts.yml
host_key_checking = False
stdout_callback = ansible.builtin.default
interpreter_python = auto_silent

[callback_default]
result_format = yaml
[privilege_escalation]
become = False
