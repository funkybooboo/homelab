# node_glue -- what a PVE node needs to be ANSIBLE-MANAGED + the
# observability agents + the update plan (OPS-23):
#  - proxmoxer python lib (community.proxmox modules run ON the node)
#  - node_exporter (prometheus scrapes the node)
#  - promtail (journald -> loki; grafana repo package)
#  - unattended-upgrades, security-only (NEEDRESTART AUTO STAYS OFF
#    on nodes: cluster services restart only with the node)
#
# TENSION, recorded: Debian trixie ships proxmoxer 2.2.0, but
# community.proxmox 2.1.0's token-auth path requires >= 2.3. The apt
# package pulls the python deps; pip then overlays the newer
# proxmoxer into /usr/local (import order beats apt's /usr/lib copy).
# Revisit when trixie ships 2.3+: then the pip step can go.
- name: proxmoxer via apt (base + python deps)
  ansible.builtin.apt:
    name: [python3-proxmoxer, python3-pip]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: proxmoxer >= 2.3 via pip overlay (token-auth requirement)
  ansible.builtin.command:
    argv:
      - /usr/bin/pip3
      - install
      - --break-system-packages
      - proxmoxer>=2.3
  register: _proxmoxer_pip
  changed_when: "'Successfully installed' in _proxmoxer_pip.stdout"

- name: Verify the proxmoxer version the modules will import
  ansible.builtin.command:
    argv: [/usr/bin/python3, -c, "import proxmoxer; print(proxmoxer.__version__)"]
  register: _proxmoxer_v
  changed_when: false
  check_mode: false   # read-only probe: must run even under --check

- name: Assert proxmoxer >= 2.3
  ansible.builtin.assert:
    that: "_proxmoxer_v.stdout is version('2.3', '>=')"
    fail_msg: "proxmoxer {{ _proxmoxer_v.stdout }} still < 2.3 (pip overlay lost?)"

# --- observability agents (OPS-11 infra batch) ---
- name: deb822 prerequisite (the deb822_repository module needs it;
#  the x86 PVE nodes carry it incidentally, the minimal Pi does not)
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Grafana apt repo (promtail lives there)
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: Grafana repo (deb822)
  ansible.builtin.deb822_repository:
    name: grafana
    types: [deb]
    uris: https://apt.grafana.com
    suites: [stable]
    components: [main]
    signed_by: /etc/apt/keyrings/grafana.asc
    state: present

- name: Manual node_exporter absent (it shadows :9100 and
        apt never updates it; the Debian package replaces it)
  ansible.builtin.systemd:
    name: node_exporter
    state: stopped
    enabled: false
  failed_when: false   # absent units are fine

- name: Old exporter unit file + binary absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/node_exporter.service
    - /usr/local/bin/node_exporter

- name: node_exporter + promtail (forced cache refresh -- the grafana
        repo was JUST added; cache_valid_time would skip it)
  ansible.builtin.apt:
    name: [prometheus-node-exporter, promtail]
    state: present
    update_cache: true

- name: promtail data dir (grafana packages never create it)
  ansible.builtin.file:
    path: /var/lib/promtail
    state: directory
    owner: promtail
    group: nogroup   # the package user's primary group
    mode: "0755"

- name: Root-owned promtail leftovers absent (only the root-owned
        ones; the live positions.yaml belongs to promtail and must
        survive -- see docs/quirks.md)
  ansible.builtin.shell: |
    found=$(find /var/lib/promtail -maxdepth 1 \( -name 'positions.yaml*' -o -name '.positions.yaml*' \) -user root 2>/dev/null)
    if [ -n "$found" ]; then
      echo "$found" | xargs rm -f
      echo SWEPT
    fi
  register: _promtail_fossils
  changed_when: "'SWEPT' in _promtail_fossils.stdout"
  loop_control:
    label: "{{ item.path }}"

- name: promtail config (journald -> loki, the .19 infra guest)
  ansible.builtin.copy:
    dest: /etc/promtail/config.yml
    content: |
      # managed by make converge (node_glue)
      server:
        http_listen_port: 9080
      positions:
        filename: /var/lib/promtail/positions.yaml
      clients:
        - url: http://192.168.1.19:3100/loki/api/v1/push
      scrape_configs:
        - job_name: journal
          journal:
            json: false
            max_age: 12h
            labels:
              host: {{ inventory_hostname }}
              job: node-journal
          relabel_configs:
            - source_labels: ["__journal__systemd_unit"]
              target_label: unit
    mode: "0644"
  notify: restart promtail

- name: promtail can read the journal (the package never adds the
        group; without it the journal scrape silently yields nothing)
  ansible.builtin.user:
    name: promtail
    groups: systemd-journal
    append: true
  notify: restart promtail

- name: agents running + enabled
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [prometheus-node-exporter, promtail]

- name: USB-NIC self-heal script (the RTL8156 drops off the bus and
        re-enumerates; vmbr0 keeps the stale port and the node sits
        network-dead; re-applying the network config when the device
        returns heals it -- see docs/quirks.md)
  ansible.builtin.copy:
    src: usb-nic-recover.sh
    dest: /usr/local/sbin/usb-nic-recover.sh
    mode: "0755"

- name: udev rule -- nic0 returning triggers the self-heal
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/72-usb-nic-recover.rules
    content: |
      # managed by make converge (node_glue): if the USB NIC
      # re-enumerates, re-apply the network config so vmbr0
      # re-enslaves the fresh device instead of sitting dead.
      ACTION=="add", SUBSYSTEM=="net", KERNEL=="nic0", RUN+="/usr/local/sbin/usb-nic-recover.sh"
    mode: "0644"

# --- truenas media mounts (USER-2): same path on every guest-
# --- capable node, so any guest can land anywhere. fstab +
# --- nofail: a dead truenas degrades the media fleet, it never
# --- hangs a node boot (boot-order law: truenas boots first)
- name: nfs-common on guest-capable nodes (Debian's NFS client name;
        the pve-shared storage plugin already depends on it -- this
        task makes the dependency explicit for fstab mounts)
  when: arch | default('') == 'amd64'
  ansible.builtin.apt:
    name: nfs-common
    state: present

- name: media exports mounted (fstab + live; state:mounted is idempotent)
  when: arch | default('') == 'amd64'
  ansible.posix.mount:
    src: "{{ media_nfs_server }}:{{ item.export }}"
    path: /mnt/media/{{ item.name }}
    fstype: nfs
    opts: _netdev,nofail
    state: mounted
  loop: "{{ media_mounts }}"
  loop_control:
    label: "{{ item.name }}"

# --- GPU (thermaltake; USER-2). The GTX 1060 has no apt-managed
# --- driver: the full situation is in docs/quirks.md. The .run
# --- 580.142 series is pinned in group_vars and marker-gated here,
# --- with --dkms so future kernels rebuild it.
- name: headers for the running kernel (PVE renamed its kernel
        packages -- proxmox-headers-* provides linux-headers-*; the
        apt module's own idempotence beats substring-matching raw
        apt-get output)
  when: gpu | default(false)
  ansible.builtin.apt:
    name: "proxmox-headers-{{ ansible_facts['kernel'] }}"   # ansible_facts, not the deprecated ansible_ prefix (ansible-core 2.24 removes it)
    state: present

- name: dkms build tooling present
  when: gpu | default(false)
  ansible.builtin.apt:
    name: [dkms, build-essential]
    state: present

- name: installed driver marker
  when: gpu | default(false)
  ansible.builtin.slurp:
    src: /usr/local/share/nvidia-run-version
  register: _nv_marker
  failed_when: false

- name: set_fact -- installed driver version
  when: gpu | default(false)
  ansible.builtin.set_fact:
    nvidia_run_installed: "{{ (_nv_marker.content | default('') | b64decode).strip() }}"

- name: pinned .run installer downloaded
  when: gpu | default(false) and nvidia_run_installed != nvidia_run_version
  ansible.builtin.get_url:
    url: https://us.download.nvidia.com/XFree86/Linux-x86_64/{{ nvidia_run_version }}/NVIDIA-Linux-x86_64-{{ nvidia_run_version }}.run
    dest: /usr/local/src/NVIDIA-Linux-x86_64-{{ nvidia_run_version }}.run
    mode: "0755"

- name: driver installed (silent + dkms-registered; first build
        takes ~10 min, later kernels rebuild via dkms on update)
  when: gpu | default(false) and nvidia_run_installed != nvidia_run_version
  ansible.builtin.command:
    argv:
      - /bin/sh
      - /usr/local/src/NVIDIA-Linux-x86_64-{{ nvidia_run_version }}.run
      - --silent
      - --dkms
  register: _nv_install
  changed_when: _nv_install.rc == 0

- name: version marker written
  when: gpu | default(false) and nvidia_run_installed != nvidia_run_version
  ansible.builtin.copy:
    dest: /usr/local/share/nvidia-run-version
    owner: root
    group: root
    mode: "0644"
    content: "{{ nvidia_run_version }}"

- name: kernel module loaded now (probe is idempotent)
  when: gpu | default(false)
  ansible.builtin.command:
    argv: [modprobe, nvidia]
  changed_when: false
  failed_when: false

- name: UVM devnode boot unit (nvidia-modprobe -c -- ctl+uvm, mode 0666;
        the CT passthrough needs world-open devnodes at boot)
  when: gpu | default(false)
  ansible.builtin.copy:
    dest: /etc/systemd/system/nvidia-uvm-devnodes.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # managed by make converge (node_glue, USER-2): /dev/nvidia*
      # + /dev/nvidia-uvm exist with 0666 at boot. nvidia-uvm is NOT
      # created by module load alone --
      # nvidia-modprobe must run after the module is up.
      [Unit]
      Description=NVIDIA UVM device nodes (homelab)
      After=multi-user.target

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/nvidia-modprobe -c -u -m
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  notify: start uvm devnodes

- name: verify -- GPU answers (driver + module + devnodes)
  when: gpu | default(false)
  ansible.builtin.command:
    argv: [nvidia-smi, --query-gpu=name, "--format=csv,noheader"]
  register: _gpu_check
  changed_when: false
  retries: 3
  delay: 10
  until: _gpu_check.rc == 0

# --- the update plan (OPS-23), tier B ---
- name: unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Security-only unattended-upgrades (51* wins over stock 50*)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51homelab-security-only
    content: |
      // managed by make converge (node_glue, OPS-23)
      // PVE packages NEVER auto-apply (pve-no-subscription mixes
      // everything; full upgrades happen in the weekly make update).
      Unattended-Upgrade::Origins-Pattern {
              "origin=Debian,codename=${distro_codename}-security";
              "origin=Debian,codename=${distro_codename},label=Debian-Security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: "0644"
