# jellyfin -- USER-2: the movie/TV server, on the GPU node.
# Repo-installed; rides make update like grafana/tailscale. GPU
# notes: the devnode passthrough is guests.yml's job (manifest
# gpu: true); the driver + UVM unit are node_glue's; the full
# driver situation is in docs/quirks.md.
- name: Jellyfin repo key (jellyfin_team.gpg.key; the older
        jellyfin.gpg.key name no longer exists)
  ansible.builtin.get_url:
    url: https://repo.jellyfin.org/jellyfin_team.gpg.key
    dest: /etc/apt/keyrings/jellyfin.asc
    mode: "0644"

- name: Jellyfin repo (deb822, trixie suite)
  ansible.builtin.deb822_repository:
    name: jellyfin
    types: [deb]
    uris: https://repo.jellyfin.org/debian
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: /etc/apt/keyrings/jellyfin.asc
    state: present

- name: Jellyfin installed (forced refresh -- repo just added)
  ansible.builtin.apt:
    name: [jellyfin, rsync]
    state: present
    update_cache: true

# ---- CT-side NVIDIA userspace (NVENC/NVDEC libs + nvidia-smi).
# The devnodes alone are NOT enough: the host .run installs its
# userspace on the HOST only; the CT needs matching libs at the
# same version or hardware transcode cannot initialize. The
# classic LXC recipe: the same .run, --no-kernel-module. Same pin
# as the host (group_vars), so module and libs never diverge.
- name: installed CT driver marker
  ansible.builtin.slurp:
    src: /usr/local/share/nvidia-run-version
  register: _nv_ct_marker
  failed_when: false

- name: set_fact -- installed CT driver version
  ansible.builtin.set_fact:
    nvidia_ct_installed: "{{ (_nv_ct_marker.content | default('') | b64decode).strip() }}"

- name: pinned .run downloaded (same pin as the host's)
  when: nvidia_ct_installed != nvidia_run_version
  ansible.builtin.get_url:
    url: https://us.download.nvidia.com/XFree86/Linux-x86_64/{{ nvidia_run_version }}/NVIDIA-Linux-x86_64-{{ nvidia_run_version }}.run
    dest: /usr/local/src/NVIDIA-Linux-x86_64-{{ nvidia_run_version }}.run
    mode: "0755"

- name: userspace-only driver installed (--no-kernel-module; the
        kernel side is the host's, via the devnode passthrough)
  when: nvidia_ct_installed != nvidia_run_version
  ansible.builtin.command:
    argv:
      - /bin/sh
      - /usr/local/src/NVIDIA-Linux-x86_64-{{ nvidia_run_version }}.run
      - --silent
      - --no-kernel-module
  register: _nv_ct_install
  changed_when: _nv_ct_install.rc == 0

- name: CT driver marker written
  when: nvidia_ct_installed != nvidia_run_version
  ansible.builtin.copy:
    dest: /usr/local/share/nvidia-run-version
    owner: root
    group: root
    mode: "0644"
    content: "{{ nvidia_run_version }}"

- name: verify -- the GPU answers FROM INSIDE the CT (devnodes +
        matching userspace -- the whole transcode stack present)
  ansible.builtin.command:
    argv: [nvidia-smi, --query-gpu=name, "--format=csv,noheader"]
  register: _nv_ct_check
  changed_when: false
  failed_when: _nv_ct_check.rc != 0

- name: Media-wait boot drop-in (boot-race guard -- if truenas is
        slow or down at CT start, wait 60s for
        the binds, then start ANYWAY -- a degraded jellyfin beats a
        dead one, and the CT restarts on the next node converge)
  ansible.builtin.copy:
    dest: /etc/systemd/system/jellyfin.service.d/50-homelab-media-wait.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # managed by make converge (jellyfin role, USER-2)
      [Service]
      ExecStartPre=/bin/sh -c 'i=0; until mountpoint -q /mnt/media/media/movies && mountpoint -q /mnt/media/media/tvshows; do i=$$((i+1)); [ $$i -ge 12 ] && exit 0; sleep 5; done; exit 0'
  notify: restart jellyfin

# ---- the metadata restore (the 715-movie library DB + watched
# ---- state). Source: the vzdump extraction, from-dump-102 (see
# ---- docs/data-to-extract.md). The extracted tree is the full
# ---- rootfs; the restore copies the two dirs out of it.
# ---- Marker-gated once: converge is idempotent after, and a live
# ---- library is never clobbered. An absent source skips silently.
- name: restore marker present? (once-only gate)
  ansible.builtin.stat:
    path: /var/lib/jellyfin/homelab-restore.done
  register: _jf_restored

- name: stop for the restore window (fresh install auto-started it)
  when: not _jf_restored.stat.exists
  ansible.builtin.service:
    name: jellyfin
    state: stopped

- name: controller holds a real 102 dump? (files, not a bare dir;
        restore gates check content -- see docs/quirks.md)
  when: not _jf_restored.stat.exists
  become: false
  ansible.builtin.command:
    argv: [find, "{{ jellyfin_restore_dir }}/from-dump-102/var/lib/jellyfin", -type, f, -print, -quit]
  register: _jf_src
  delegate_to: localhost
  changed_when: false
  failed_when: false

- name: restore config + library metadata (only while the marker is
        absent AND the dump exists -- fresh-state otherwise; never
        clobbers, never re-runs)
  when:
    - not _jf_restored.stat.exists
    - (_jf_src.stdout | default('') | length) > 0
  block:
    - name: legacy /etc/jellyfin restored
      ansible.builtin.copy:
        src: "{{ jellyfin_restore_dir }}/from-dump-102/etc/jellyfin"
        dest: /etc/
        owner: jellyfin
        group: jellyfin

    - name: legacy /var/lib/jellyfin restored (rsync; the copy
            module is too slow for large trees -- docs/quirks.md)
      ansible.posix.synchronize:
        src: "{{ jellyfin_restore_dir }}/from-dump-102/var/lib/jellyfin/"
        dest: /var/lib/jellyfin/
        rsync_opts:
          - "--chown=jellyfin:jellyfin"
      notify: restart jellyfin

    - name: restored config writable by the service (dump preserves
            root ownership from the old CT's rsync era)
      ansible.builtin.file:
        path: /etc/jellyfin
        owner: jellyfin
        group: jellyfin
        recurse: true

    - name: restore marker written (INSIDE the block -- only when the
            restore actually ran; an absent or empty source must NOT
            close the window)
      ansible.builtin.copy:
        dest: /var/lib/jellyfin/homelab-restore.done
        owner: jellyfin
        group: jellyfin
        mode: "0644"
        content: |
          Managed by make converge (jellyfin role, USER-2).
          Restore source: legacy-extraction/from-dump-102.
          This marker present = the restore RAN.

- name: Jellyfin running + enabled
  ansible.builtin.service:
    name: jellyfin
    state: started
    enabled: true
    daemon_reload: true

- name: verify -- the server answers (first boot runs migrations)
  ansible.builtin.uri:
    url: http://localhost:8096/health
    status_code: [200]
  register: _jf_check
  retries: 12
  delay: 10
  until: _jf_check.status == 200
