# audiobookshelf -- USER-2: audiobooks + books + podcasts server.
# Repo-installed (the vendor's own flat apt repo -- GitHub release
# binaries no longer exist, checked 2026-11-26; the repo is the
# official Debian path per their docs), rides `make update` like
# every repo-installed app.
- name: gnupg present (key dearmor)
  ansible.builtin.apt:
    name: gnupg
    state: present

- name: Audiobookshelf repo key
  ansible.builtin.get_url:
    url: https://advplyr.github.io/audiobookshelf-ppa/KEY.gpg
    dest: /usr/local/src/audiobookshelf-KEY.gpg
    mode: "0644"

- name: key dearmored into the keyring
  ansible.builtin.command:
    argv: [/usr/bin/gpg, --dearmor, -o, /etc/apt/keyrings/audiobookshelf.gpg,
           /usr/local/src/audiobookshelf-KEY.gpg]
    creates: /etc/apt/keyrings/audiobookshelf.gpg

- name: Audiobookshelf flat repo (the vendor's documented line, verbatim)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/audiobookshelf.list
    owner: root
    group: root
    mode: "0644"
    content: |
      # managed by make converge (audiobookshelf role, USER-2)
      deb [signed-by=/etc/apt/keyrings/audiobookshelf.gpg] https://advplyr.github.io/audiobookshelf-ppa ./
  notify: restart audiobookshelf

- name: Audiobookshelf installed (forced refresh -- repo just added)
  ansible.builtin.apt:
    name: audiobookshelf
    state: present
    update_cache: true

# ---- the metadata restore (tier-1 dump: listening progress +
# ---- config). The old CT's data lived at ONE of two documented
# ---- alternates (/var/lib/audiobookshelf or /audiobookshelf --
# ---- binary-era vs deb-era layout); the tarball that exists tells
# ---- us which, and the service paths follow the data. Marker-
# ---- gated ONCE, same contract as the other media roles.
- name: restore marker present? (once-only gate)
  ansible.builtin.stat:
    path: /var/lib/audiobookshelf/homelab-restore.done
  register: _abs_restored

- name: stop for the restore window (fresh install auto-started it)
  when: not _abs_restored.stat.exists
  ansible.builtin.service:
    name: audiobookshelf
    state: stopped

- name: which era does the 133 dump carry, with REAL content?
        (files, not bare dirs -- interrupted extractions leave
        empties; found live 2026-11-26. deb-era = the old CT's
        vendor-default /usr/share layout, confirmed at extraction)
  when: not _abs_restored.stat.exists
  become: false
  ansible.builtin.command:
    argv: [find, "{{ audiobookshelf_restore_dir }}/from-dump-133/{{ item.src }}", -type, f, -print, -quit]
  register: _abs_src
  delegate_to: localhost
  changed_when: false
  failed_when: false
  loop:
    - { era: deb, src: usr/share/audiobookshelf }
    - { era: varlib, src: var/lib/audiobookshelf }
    - { era: root, src: audiobookshelf }
  loop_control:
    label: "{{ item.era }}"

- name: set_fact -- which era the dump carries
  when: not _abs_restored.stat.exists
  ansible.builtin.set_fact:
    _abs_era: "{{ 'none' if (_abs_src.results | map(attribute='stdout') | join | length == 0) else
                   (_abs_src.results | selectattr('stdout') | map(attribute='item.era') | first) }}"

- name: legacy data restored + owned (each era to its own path; the
        service-path probe below follows wherever it landed; an
        empty/absent source leaves the window OPEN)
  when:
    - not _abs_restored.stat.exists
    - _abs_era != 'none'
  block:
    - name: the copy
      ansible.builtin.copy:
        src: "{{ audiobookshelf_restore_dir }}/from-dump-133/{{ {'deb': 'usr/share/audiobookshelf', 'varlib': 'var/lib/audiobookshelf', 'root': 'audiobookshelf'}[_abs_era] }}"
        dest: "{{ {'deb': '/usr/share/', 'varlib': '/var/lib/', 'root': '/'}[_abs_era] }}"
      notify: restart audiobookshelf

    - name: ownership (the dump preserves the old CT's owners)
      ansible.builtin.file:
        path: "{{ {'deb': '/usr/share/audiobookshelf', 'varlib': '/var/lib/audiobookshelf', 'root': '/audiobookshelf'}[_abs_era] }}"
        owner: audiobookshelf
        group: audiobookshelf
        recurse: true

    - name: restore marker written (INSIDE the block -- only when the
            restore ran)
      ansible.builtin.copy:
        dest: /var/lib/audiobookshelf/homelab-restore.done
        owner: audiobookshelf
        group: audiobookshelf
        mode: "0644"
        content: |
          Managed by make converge (audiobookshelf role, USER-2).
          Restore source: legacy-extraction/from-dump-133
          (era {{ _abs_era }}). This marker present = the restore RAN.

# ---- service paths: follow the data (restored binary-era layout
# ---- wins; fresh install uses /var/lib)
- name: where does the app data live? (probe all three eras --
        deb-era /usr/share, binary-era /var/lib, alt root path)
  ansible.builtin.stat:
    path: "{{ item }}"
  register: _abs_layout
  changed_when: false
  loop:
    - /usr/share/audiobookshelf/config
    - /var/lib/audiobookshelf/config
    - /audiobookshelf/config

- name: set_fact -- the config base that is real (deb-era first; it
        is what the old CT actually used, confirmed 2026-11-26)
  ansible.builtin.set_fact:
    audiobookshelf_base: "{{ '/usr/share/audiobookshelf' if (_abs_layout.results[0].stat.exists | default(false)) else
                              ('/var/lib/audiobookshelf' if (_abs_layout.results[1].stat.exists | default(false)) else
                              ('/audiobookshelf' if (_abs_layout.results[2].stat.exists | default(false)) else '/var/lib/audiobookshelf')) }}"

- name: service environment (the deb reads /etc/default; paths follow
        the data layout above)
  ansible.builtin.copy:
    dest: /etc/default/audiobookshelf
    owner: root
    group: root
    mode: "0644"
    content: |
      # managed by make converge (audiobookshelf role, USER-2)
      METADATA_PATH={{ audiobookshelf_base }}/metadata
      CONFIG_PATH={{ audiobookshelf_base }}/config
      PORT=13378
  notify: restart audiobookshelf

# ---- library pre-seed: only when the app never onboarded (no
# ---- config.json); a restored config is never touched -- its
# ---- library paths may point at the old fleet's mount names, which
# ---- the story verify pass reconciles after the restore.
- name: app config present? (restored or onboarded)
  ansible.builtin.stat:
    path: "{{ audiobookshelf_base }}/config/config.json"
  register: _abs_cfg

- name: fresh config dir + pre-seeded libraries (verify-first)
  when: not _abs_cfg.stat.exists | default(false)
  block:
    - name: config + metadata dirs present
      ansible.builtin.file:
        path: "{{ audiobookshelf_base }}/{{ item }}"
        state: directory
        owner: audiobookshelf
        group: audiobookshelf
        mode: "0750"
      loop: [config, metadata]

    - name: config.json pre-seeded (books/podcasts/audiobooks binds)
      ansible.builtin.copy:
        dest: "{{ audiobookshelf_base }}/config/config.json"
        owner: audiobookshelf
        group: audiobookshelf
        mode: "0644"
        content: |
          {
            "MetadataPath": "{{ audiobookshelf_base }}/metadata",
            "audiobooks": "/media/audiobooks",
            "books": "/media/books",
            "podcasts": "/media/podcasts"
          }
      notify: restart audiobookshelf

- name: restore marker written (window closed either way)
  when: not _abs_restored.stat.exists
  ansible.builtin.copy:
    dest: /var/lib/audiobookshelf/homelab-restore.done
    owner: audiobookshelf
    group: audiobookshelf
    mode: "0644"
    content: |
      Managed by make converge (audiobookshelf role, USER-2).
      If written WITHOUT a restore, the tier-1 extraction had not
      been run yet at that converge -- see docs/data-to-extract.md.

- name: audiobookshelf running + enabled
  ansible.builtin.service:
    name: audiobookshelf
    state: started
    enabled: true

- name: verify -- the server answers
  ansible.builtin.uri:
    url: http://localhost:13378/
    status_code: [200]
  register: _abs_check
  retries: 12
  delay: 10
  until: _abs_check.status == 200
