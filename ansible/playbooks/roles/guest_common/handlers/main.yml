- name: restart sshd
  # restart, never reload (the SIGHUP re-exec cannot rebind; see
  # docs/quirks.md)
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: restart tailscaled
  ansible.builtin.service:
    name: tailscaled
    state: restarted

- name: restart promtail
  ansible.builtin.service:
    name: promtail
    state: restarted
