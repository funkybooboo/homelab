- name: restart sshd
  # restart, never reload: the SIGHUP re-exec died on CT 204
  # ('Cannot bind any address' + missing /run/sshd); restart re-runs
  # RuntimeDirectory=sshd + ExecStartPre and always heals
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: restart tailscaled
  ansible.builtin.service:
    name: tailscaled
    state: restarted

- name: restart promtail
  ansible.builtin.service:
    name: promtail
    state: restarted
