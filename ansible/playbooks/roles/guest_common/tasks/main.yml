# guest_common -- applied inside every guest by guests.yml play 3.
# The standing identity + hardening contract (issues item 9, OPS-22):
# the operator's nate account, passwordless sudo, the operator's key,
# good-ssh (password auth dead, root ssh dead -- the CT's console
# channel is pct exec on the node).
- name: Base packages
  ansible.builtin.apt:
    name: [curl]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: The operator account exists
  ansible.builtin.user:
    name: nate
    shell: /bin/bash
    groups: [sudo]
    append: true

- name: The operator's key installed
  ansible.posix.authorized_key:
    user: nate
    key: "{{ lookup('ansible.builtin.file', playbook_dir + '/files/keys/admin.ed25519.pub') }}"
    state: present
    exclusive: false

- name: Passwordless sudo for the operator
  ansible.builtin.copy:
    dest: /etc/sudoers.d/nate
    content: "nate ALL=(ALL) NOPASSWD: ALL\n"
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"

- name: sshd hardening drop-in (the good-ssh contract)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/50-homelab.conf
    content: |
      # managed by make converge (guest_common)
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: reload sshd

- name: Disable socket-activated ssh (the service owns port 22)
  # Debian 13 preset: ssh.socket holds 22 + spawns per-connection
  # daemons -- a service reload then SIGHUPs a daemon that cannot
  # rebind (the socket owns the port) and the unit crashes. The
  # plain service model reloads cleanly.
  ansible.builtin.service:
    name: ssh.socket
    state: stopped
    enabled: false

- name: sshd running + enabled
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true

# --- the update plan (OPS-23): every guest born patchable ---
- name: Update plan packages (unattended-upgrades, needrestart, node_exporter)
  ansible.builtin.apt:
    name: [unattended-upgrades, needrestart, prometheus-node-exporter]
    state: present

- name: Security-only unattended-upgrades (the 51* file wins over the stock 50*)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51homelab-security-only
    content: |
      // managed by make converge (guest_common, OPS-23)
      // v2 refinement of the old fleet's full-update allowlist:
      // full upgrades happen in the weekly `make update` pass,
      // unattended stays limited to what is safe to apply blind.
      Unattended-Upgrade::Origins-Pattern {
              "origin=Debian,codename=${distro_codename}-security";
              "origin=Debian,codename=${distro_codename},label=Debian-Security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: "0644"

- name: needrestart auto (CTs restart services live; old-fleet locked decision)
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/homelab.conf
    content: |
      # managed by make converge (guest_common, OPS-23): a service
      # restart blip at 03:30 is accepted; a CT never needs a reboot.
      $nrconf{restart} = 'a';
    mode: "0644"

- name: node_exporter running + enabled
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: true

# --- the access layer, model B (issues item 4, revised 2026-11-22):
# every guest enrolls in the tailnet; a manifest tailnet_serve port
# gets an https serve front (https://<name>.tail54538d.ts.net) ---
- name: Tailscale apt repo (official, per-release)
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: https://pkgs.tailscale.com/stable/debian
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg
    state: present

- name: tailscale installed (forced refresh -- the repo was just added)
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: userspace networking (no /dev/net/tun in unprivileged CTs;
        inbound + serve fronts work; outbound rides the LAN)
  ansible.builtin.copy:
    dest: /etc/default/tailscaled
    content: |
      # managed by make converge (guest_common): model B, issues 4.
      # PORT must stay: the unit runs --port=${PORT} and an empty
      # expansion is a flag error that crashes the service.
      PORT=41641
      FLAGS="--tun=userspace-networking"
    mode: "0644"
  notify: restart tailscaled

- name: tailscaled running + enabled
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true

- name: Enrolled? (probe; tailscale status fails when logged out)
  ansible.builtin.command:
    argv: [/usr/bin/tailscale, status]
  register: _ts_state
  changed_when: false
  failed_when: _ts_state.rc not in [0, 1]

- name: Enroll with the preauth key (once per guest)
  ansible.builtin.command:
    argv:
      - /usr/bin/tailscale
      - up
      - --authkey={{ lookup('ansible.builtin.env', 'TS_AUTH_KEY') }}
      - --hostname={{ inventory_hostname }}
  when: _ts_state.rc != 0
  no_log: true

- name: https serve front (manifest tailnet_serve; re-apply is a no-op)
  when: tailnet_serve is defined
  ansible.builtin.command:
    argv:
      - /usr/bin/tailscale
      - serve
      - --bg
      - --https=443
      - http://localhost:{{ tailnet_serve }}
  changed_when: false   # serve state is tailscaled's, not ansible's
