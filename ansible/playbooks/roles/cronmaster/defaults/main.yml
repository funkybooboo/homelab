# cronmaster defaults -- version pins + fixed paths.
# The app itself is digest-pinned in the manifest; the only other
# moving part the CT needs is the bitwarden CLI for the
# protonpass-to-bitwarden job (stock nodejs 20 runs it).
cronmaster_bw_version: "2026.11.1"

# The app bits are staged from the digest-pinned image (the bare-run
# pivot): docker create + docker cp of the standalone tree, then the
# container is removed. docker-ce stays installed for staging only.
cronmaster_extract: "{{ playbook_dir | dirname | dirname }}/legacy-extraction/from-dump-127"
cronmaster_root: /opt/cronmaster
cronmaster_manifest: "{{ playbook_dir | dirname | dirname }}/guests/cronmaster.yaml"
cronmaster_image: "{{ (lookup('ansible.builtin.file', cronmaster_manifest) | from_yaml).app_image }}"
cronmaster_digest: "{{ (lookup('ansible.builtin.file', cronmaster_manifest) | from_yaml).app_digest }}"
cronmaster_env: "{{ (lookup('ansible.builtin.file', cronmaster_manifest) | from_yaml).app_env }}"

# The ported jobs, exactly as the old CT's root crontab had them
# (same ids so the app UI binds to them on first read; same
# schedules: 23:00 codeberg migration, 00:00 protonpass sync).
# Job 1's value = Codeberg's server-side repoMigrate API -- the
# auto-CREATION of new github repos on codeberg, which forgejo's
# push mirrors cannot do (they only push to existing repos).
# Operator decision 2026-11-28, after briefly retiring it.
cronmaster_jobs:
  - id: 9ouq-ur5t
    schedule: "0 23 * * *"
    comment: "# logsEnabled: true | id: 9ouq-ur5t"
    script: migrategithubtocodebergsh.sh
    command: bash /opt/cronmaster/scripts/migrategithubtocodebergsh.sh
  - id: gm21-x7le
    schedule: "0 0 * * *"
    comment: "# logsEnabled: true | id: gm21-x7le"
    script: protonpass-to-bitwarden-syncsh.sh
    command: bash /opt/cronmaster/scripts/protonpass-to-bitwarden-syncsh.sh
