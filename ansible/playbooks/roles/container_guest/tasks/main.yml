# container_guest -- the fleet's container mechanism. A manifest
# with a `container:` block (image, digest, port, target) gets
# docker + compose, a digest-pinned compose file, and a
# systemd-managed `compose up --wait`. One role serves every
# container-native service: USER-3's browser tools + freshrss
# first; the ONCE trio inherits the proven pattern.
#
# Conventions (the ONCE note, USER-14): official images pinned by
# DIGEST, never a floating tag; updates roll via make update
# (roll-pins.sh rewrites the manifest digest, the version-gated
# compose re-pulls and restarts); never a vendor installer.
#
# Model B front: the container listens on 127.0.0.1:<port>;
# guest_common's tailnet serve fronts it as
# https://<name>.tail54538d.ts.net.
#
# Optional manifest `restore:` block (freshrss): content-gated
# once-only copy from the legacy extraction, marker written only
# inside the block -- an absent source leaves the window open,
# the same contract as the media roles (docs/quirks.md).
- name: manifest carries a container block (role guard)
  ansible.builtin.fail:
    msg: "container_guest requires a container block in the manifest"
  when: (app_container | default({})).image is not defined

# ---- optional legacy data restore (before the container first
# ---- boots with a digest change, so a restore never needs a
# ---- second restart): marker-gated once, content-gated source
- name: rsync installed (the restore block's synchronize needs it
        on BOTH ends; tiny package, every container guest gets it)
  ansible.builtin.apt:
    name: rsync
    state: present

- name: restore marker present? (once-only gate)
  when: app_restore.src is defined
  ansible.builtin.stat:
    path: /usr/local/share/container-restore.done
  register: _cg_restored

- name: controller holds a real extraction? (files, not a bare dir)
  when:
    - app_restore.src is defined
    - not _cg_restored.stat.exists
  become: false
  ansible.builtin.command:
    argv: [find, "{{ container_restore_base }}/{{ app_restore.src }}", -type, f, -print, -quit]
  register: _cg_src
  delegate_to: localhost
  changed_when: false
  failed_when: false

- name: legacy data restored (only while unmarked AND the source
        holds files; an absent source leaves the window OPEN)
  when:
    - app_restore.src is defined
    - not _cg_restored.stat.exists
    - (_cg_src.stdout | default('') | length) > 0
  block:
    - name: the copy (synchronize -- the copy module crawls at
            ~0.5 files/s over ssh+NFS and a restore tree is thousands
            of small files; the jellyfin lesson applies. Numeric owner
            33, the container's www-data. Merge semantics, no --delete
            (the container may hold live state during a re-run)
      ansible.posix.synchronize:
        src: "{{ container_restore_base }}/{{ app_restore.src }}/"
        dest: "{{ app_restore.dest_parent }}data/"
        rsync_opts:
          - "--chown=33:33"
      notify: restart app compose

    - name: restore marker written (INSIDE the block -- only when
            the restore ran)
      ansible.builtin.copy:
        dest: /usr/local/share/container-restore.done
        owner: root
        group: root
        mode: "0644"
        content: |
          Managed by make converge (container_guest role).
          Restore source: {{ container_restore_base }}/{{ app_restore.src }}.
          This marker present = the restore RAN.

# ---- docker (official repo, trixie; the ONCE pattern: docker +
# ---- compose inside a nesting-enabled CT)
- name: Docker apt repo (official, per-release)
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/debian
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    signed_by: https://download.docker.com/linux/debian/gpg
    state: present

- name: docker installed (forced refresh -- the repo was just added)
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true   # no cache_valid_time: the repo above is
                          # minutes old and the cache predates it

- name: app dir present
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: config dir present (manifest config_files land here and
        bind into the container)
  ansible.builtin.file:
    path: /opt/app/config
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: config files deployed (manifest container config_files;
        the SEARXNG_SECRET_KEY_PLACEHOLDER token is replaced from
        the controller env at deploy time -- local/searxng-secret.env,
        sourced by make. Secrets never land in the tracked manifest)
  when: app_container.config_files is defined
  ansible.builtin.copy:
    content: "{{ item.content | replace('SEARXNG_SECRET_KEY_PLACEHOLDER', lookup('ansible.builtin.env', 'SEARXNG_SECRET_KEY') | default('')) }}"
    dest: "/opt/app/config/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ app_container.config_files }}"
  loop_control:
    label: "{{ item.dest }}"
  notify: restart app compose

- name: placeholder used without the secret env (fail loud)
  when:
    - app_container.config_files is defined
    - (app_container.config_files | map(attribute='content') | join('')) is search('SEARXNG_SECRET_KEY_PLACEHOLDER')
    - (lookup('ansible.builtin.env', 'SEARXNG_SECRET_KEY') | default('')) | length == 0
  ansible.builtin.fail:
    msg: "searxng needs SEARXNG_SECRET_KEY -- create local/searxng-secret.env (SEARXNG_SECRET_KEY=<hex>)"

# ---- env:NAME secret tokens (USER-5): manifest env values of the
# form "env:NAME" resolve from the controller environment at render
# time (make converge sources local/*-secrets.env). Fail LOUD here,
# BEFORE the compose file lands -- otherwise the template renders an
# empty secret silently and the service dies at runtime with a
# mystery auth failure. (The assert prints the variable NAME, never
# the value; names are already public in the manifest.)
- name: env tokens present in the controller env? (fail loud)
  when:
    - app_container.env is defined
    - item.value is string
    - item.value.startswith('env:')
  ansible.builtin.assert:
    that:
      - (lookup('ansible.builtin.env', item.value[4:]) | default('')) | length > 0
    fail_msg: >-
      container env key {{ item.key }} uses {{ item.value }} but the
      controller env does not define it -- add it to the service's
      local/*-secrets.env (see local/README.md)
  loop: "{{ app_container.env | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: compose file deployed
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/app/docker-compose.yml
    owner: root
    group: root
    mode: "0644"
  notify: restart app compose

- name: compose unit deployed
  ansible.builtin.template:
    src: app-compose.service.j2
    dest: /etc/systemd/system/app-compose.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart app compose

- name: compose unit enabled + started
  ansible.builtin.systemd:
    name: app-compose
    state: started
    enabled: true
    daemon_reload: true

# ---- optional nightly mysqldump (manifest container.mysql_backup:
# true -- the shared mysql guest CT 107). Sync data is tier-1
# (passwords/bookmarks); dumps live in-guest on the node-local
# rootfs, vzdump carries them off-box Saturdays. 14-day rotation.
- name: backup env file (root password from the controller env;
        0600, never in the repo)
  when: app_container.mysql_backup | default(false)
  ansible.builtin.copy:
    dest: /opt/app/backup.env
    owner: root
    group: root
    mode: "0600"
    content: |
      # managed by make converge (container_guest mysql_backup)
      MYSQL_ROOT_PASSWORD={{ lookup('ansible.builtin.env', 'MYSQL_ROOT_PASSWORD') }}
  no_log: true

- name: backup script deployed
  when: app_container.mysql_backup | default(false)
  ansible.builtin.copy:
    dest: /usr/local/bin/mysql-backup.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      # managed by make converge (container_guest mysql_backup)
      set -eu
      . /opt/app/backup.env
      mkdir -p /var/backups/mysql
      OUT="/var/backups/mysql/all-$(date +%F).sql.gz"
      docker compose -f /opt/app/docker-compose.yml exec -T app \
        mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" \
        --all-databases --single-transaction | gzip > "$OUT"
      find /var/backups/mysql -name 'all-*.sql.gz' -mtime +14 -delete
      echo "dumped $OUT"

- name: backup service + timer deployed
  when: app_container.mysql_backup | default(false)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - dest: mysql-backup.service
      content: |
        [Unit]
        Description=nightly mysql dump (container_guest)
        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/mysql-backup.sh
    - dest: mysql-backup.timer
      content: |
        [Unit]
        Description=nightly mysql dump timer (container_guest)
        [Timer]
        OnCalendar=*-*-* 03:17:00
        Persistent=true
        [Install]
        WantedBy=timers.target

- name: backup timer enabled + started
  when: app_container.mysql_backup | default(false)
  ansible.builtin.systemd:
    name: mysql-backup.timer
    state: started
    enabled: true
    daemon_reload: true
