# grafana -- dashboards UI. Datasources provisioned (prometheus +
# loki); dashboards are built in the UI (or restored from the old
# fleet's dump 123 later, per OPS-11).
- name: Grafana apt repo key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: Grafana repo (deb822)
  ansible.builtin.deb822_repository:
    name: grafana
    types: [deb]
    uris: https://apt.grafana.com
    suites: [stable]
    components: [main]
    signed_by: /etc/apt/keyrings/grafana.asc
    state: present

- name: grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true

- name: datasources (provisioned -- prometheus default + loki)
  ansible.builtin.copy:
    dest: /etc/grafana/provisioning/datasources/homelab.yml
    content: |
      # managed by make converge (grafana role)
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://192.168.1.17:9090
          isDefault: true
        - name: Loki
          type: loki
          access: proxy
          url: http://192.168.1.19:3100
    mode: "0644"
  notify: restart grafana

- name: grafana running + enabled
  ansible.builtin.service:
    name: grafana-server
    state: started
    enabled: true
