# guests.yml -- the OPS-7 core: guest lifecycle driven by the
# guests/*.yaml manifests.
#
# Play 1: load manifests (localhost, repo access).
# Play 2: on the API host -- create missing CTs via the PVE API
#         (homelab-ops token), bootstrap the operator account inside
#         each new CT via `pct exec`/`pct push` (the console channel:
#         no root ssh ever), then register guests for play 3.
# Play 3: inside each guest over ssh as the operator -- guest_common
#         (good-ssh, sudo, packages) + the manifest's role.
#
# Identity model (issues item 9): the API acts as the operator's
# token; CTs get the operator's nate account; root ssh stays dead
# everywhere (pct exec is the console-equivalent channel).
- name: Load guest manifests
  hosts: localhost
  connection: local
  gather_facts: false
  become: false   # group_vars become:true is global; debbie never escalates
  tasks:
    - name: Read guests/*.yaml
      ansible.builtin.set_fact:
        guests: "{{ guests | default([]) + [lookup('ansible.builtin.file', item) | from_yaml] }}"
      loop: "{{ lookup('ansible.builtin.fileglob', playbook_dir ~ '/../../guests/*.yaml', wantlist=true) }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Is a staged PGDATA restore waiting? (gate for the postgres role)
      ansible.builtin.stat:
        path: "{{ playbook_dir | dirname | dirname }}/local/staging/pgdata-108.tar.gz"
      register: _pgdata_stage

    - name: pgdata_staged fact (read by the postgres role)
      ansible.builtin.set_fact:
        pgdata_staged: "{{ _pgdata_stage.stat.exists }}"

- name: Converge guests on the cluster
  hosts: pve-thermaltake
  become: true
  gather_facts: false
  tasks:
    - name: Destroy guests whose manifest says absent
      when: item.state | default('present') == 'absent'
      community.proxmox.proxmox:
        api_host: "{{ pve_api_host }}"
        api_user: "{{ pve_api_user }}"
        # full user!token form: the module parses it natively
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ lookup('ansible.builtin.env', 'PVE_API_TOKEN_SECRET') }}"
        # PVE node certs are self-signed per-hostname; TLS still
        # encrypts, the token gates access. Trusted certs = later.
        validate_certs: false
        vmid: "{{ item.vmid }}"
        node: "{{ item.node }}"
        state: absent
        force: true   # stop-then-destroy; absents are manifest-reviewed
      loop: "{{ hostvars['localhost']['guests'] }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create guests (PVE API, idempotent -- present = create if missing)
      when: item.state | default('present') == 'present'
      community.proxmox.proxmox:
        api_host: "{{ pve_api_host }}"
        api_user: "{{ pve_api_user }}"
        # full user!token form: the module parses it natively
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ lookup('ansible.builtin.env', 'PVE_API_TOKEN_SECRET') }}"
        # PVE node certs are self-signed per-hostname; TLS still
        # encrypts, the token gates access. Trusted certs = later.
        validate_certs: false
        vmid: "{{ item.vmid }}"
        hostname: "{{ item.name }}"
        node: "{{ item.node }}"
        # default: template from the CT's own storage (pve-shared
        # carries vztmpl); lvmthin rootfs storages cannot host templates
        # (content-type limitation) so manifests may override with an
        # explicit ostemplate volid (vaultwarden does -- local-lvm rootfs
        # for tier-0 truenas-independence, template read once from pve-shared)
        ostemplate: "{{ item.ostemplate | default(item.storage ~ ':vztmpl/' ~ item.template) }}"
        storage: "{{ item.storage }}"
        disk: "{{ item.storage }}:{{ item.disk }}"   # PVE volid form;
                                   # a bare size fails the non-root
                                   # path check (Storage.pm 729)
        cores: "{{ item.cores }}"
        memory: "{{ item.memory }}"
        swap: "{{ item.swap }}"
        netif:
          net0: "name=eth0,bridge=vmbr0,ip={{ item.ip }}/24,gw={{ lan.gateway }}"
        nameserver: "{{ lan.dns | join(' ') }}"
        unprivileged: true
        onboot: true
        state: present
        # update defaults TRUE in community.proxmox 2.1.0 (every run
        # re-applies config + reports changed). We want create-if-
        # missing with real idempotence; drift is make verify's
        # job (OPS-15). To change an existing guest's resources:
        # one-off run with -e guest_update=true.
        update: "{{ guest_update | default(false) }}"
        description: "managed by make converge (guests/{{ item.name }}.yaml)"
      loop: "{{ hostvars['localhost']['guests'] }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Ensure guests running
      when: item.state | default('present') == 'present'
      community.proxmox.proxmox:
        api_host: "{{ pve_api_host }}"
        api_user: "{{ pve_api_user }}"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ lookup('ansible.builtin.env', 'PVE_API_TOKEN_SECRET') }}"
        validate_certs: false
        vmid: "{{ item.vmid }}"
        node: "{{ item.node }}"
        state: started
      loop: "{{ hostvars['localhost']['guests'] }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Apply missing mp entries (USER-2 media binds; verify-first
            -- pct config grep before every pct set, so converge is
            idempotent; a present entry is never touched)
      when:
        - item.state | default('present') == 'present'
        - item.mounts | default([]) | length > 0
      ansible.builtin.shell: |
        set -eu
        C={{ item.vmid }}
        CHANGED=0
        {% for m in item.mounts %}
        if ! pct config $C | grep -q "^mp{{ loop.index0 }}: {{ m.src }},mp={{ m.mp }}"; then
          pct set $C --mp{{ loop.index0 }} {{ m.src }},mp={{ m.mp }}
          CHANGED=1
        fi
        {% endfor %}
        test $CHANGED -eq 0 || echo APPLIED
      register: _mp_apply
      delegate_to: "{{ item.node }}"
      changed_when: "'APPLIED' in _mp_apply.stdout"
      loop: "{{ hostvars['localhost']['guests'] }}"
      loop_control:
        index_var: idx
        label: "{{ item.name }}"

    - name: GPU devnode passthrough (pct has no --dev option; the
            lxc lines are written directly, each guarded so re-runs
            are silent; uvm major is DYNAMIC -- read from
            /proc/devices at apply time, never hardcode)
      when:
        - item.state | default('present') == 'present'
        - item.gpu | default(false)
      ansible.builtin.shell: |
        set -eu
        CONF=/etc/pve/lxc/{{ item.vmid }}.conf
        CHANGED=0
        UVM=$(grep -w nvidia-uvm /proc/devices | awk '{print $1}')
        if [ -z "$UVM" ]; then
          echo "nvidia-uvm missing from /proc/devices (driver not loaded)"
          exit 1
        fi
        ensure() { grep -qF "$1" "$CONF" || { printf '%s\n' "$1" >> "$CONF"; CHANGED=1; } }
        ensure "lxc.cgroup2.devices.allow: c 195:* rwm"
        ensure "lxc.cgroup2.devices.allow: c $UVM:* rwm"
        ensure "lxc.mount.entry: /dev/nvidiactl dev/nvidiactl none bind,optional,create=file"
        ensure "lxc.mount.entry: /dev/nvidia0 dev/nvidia0 none bind,optional,create=file"
        ensure "lxc.mount.entry: /dev/nvidia-uvm dev/nvidia-uvm none bind,optional,create=file"
        ensure "lxc.mount.entry: /dev/nvidia-uvm-tools dev/nvidia-uvm-tools none bind,optional,create=file"
        test $CHANGED -eq 0 || echo APPLIED
      register: _dev_apply
      delegate_to: "{{ item.node }}"
      changed_when: "'APPLIED' in _dev_apply.stdout"
      loop: "{{ hostvars['localhost']['guests'] }}"
      loop_control:
        index_var: idx
        label: "{{ item.name }}"

    - name: Apparmor overlay mounts for container guests
            (docker-in-LXC -- the generated profile denies overlay mounts
            by default; two guarded raw lines + a restart unlock them.
            Validated on the 7.0.14-pve kernel + apparmor 4.x parser.
            fstype and options cannot share one rule -- BOTH lines are
            required, and options=(rw, move) is the only valid move form)
      when:
        - item.state | default('present') == 'present'
        - item.container is defined
      ansible.builtin.shell: |
        set -eu
        CONF=/etc/pve/lxc/{{ item.vmid }}.conf
        CHANGED=0
        ensure() { grep -qxF "$1" "$CONF" || { printf '%s\n' "$1" >> "$CONF"; CHANGED=1; } }
        ensure "lxc.apparmor.raw: mount fstype=overlay,"
        ensure "lxc.apparmor.raw: mount options=(rw, move),"
        test $CHANGED -eq 0 || echo APPLIED
      register: _aa_apply
      delegate_to: "{{ item.node }}"
      changed_when: "'APPLIED' in _aa_apply.stdout"
      loop: "{{ hostvars['localhost']['guests'] }}"
      loop_control:
        index_var: aa_idx
        label: "{{ item.name }}"

    - name: Apply manifest features (nesting -- PVE 9 wants the
            key=value form, and the creation module cannot pass
            features at all; guarded pct config grep, re-runs silent)
      when:
        - item.state | default('present') == 'present'
        - item.features is defined
        - item.features | length > 0
      ansible.builtin.shell: |
        set -eu
        C={{ item.vmid }}
        WANT="features: {{ item.features | join('=1,') }}=1"
        if pct config $C | grep -q "^$WANT"; then
          exit 0
        fi
        pct set $C --features "{{ item.features | join('=1,') }}=1"
        echo APPLIED
      register: _feat_apply
      delegate_to: "{{ item.node }}"
      changed_when: "'APPLIED' in _feat_apply.stdout"
      loop: "{{ hostvars['localhost']['guests'] }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Restart container guests whose apparmor changed this run
            (profile rules apply at CT start, never live)
      when:
        - item.state | default('present') == 'present'
        - "'APPLIED' in ((_aa_apply.results[aa_idx].stdout | default('')) ~ (_feat_apply.results[aa_idx].stdout | default('')))"
      community.proxmox.proxmox:
        api_host: "{{ pve_api_host }}"
        api_user: "{{ pve_api_user }}"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ lookup('ansible.builtin.env', 'PVE_API_TOKEN_SECRET') }}"
        validate_certs: false
        vmid: "{{ item.vmid }}"
        node: "{{ item.node }}"
        state: restarted
      loop: "{{ hostvars['localhost']['guests'] }}"
      loop_control:
        index_var: aa_idx
        label: "{{ item.name }}"

    - name: Restart guests whose mounts/devnodes changed this run
            (binds + devices apply at CT start, never live)
      when:
        - item.state | default('present') == 'present'
        - ((item.mounts | default([]) | length > 0) or item.gpu | default(false))
        - >-
          ((_mp_apply.results[idx].stdout | default('')
          ~ _dev_apply.results[idx].stdout | default('')) is search('APPLIED'))
      community.proxmox.proxmox:
        api_host: "{{ pve_api_host }}"
        api_user: "{{ pve_api_user }}"
        api_token_id: "{{ pve_api_token_id }}"
        api_token_secret: "{{ lookup('ansible.builtin.env', 'PVE_API_TOKEN_SECRET') }}"
        validate_certs: false
        vmid: "{{ item.vmid }}"
        node: "{{ item.node }}"
        state: restarted
      loop: "{{ hostvars['localhost']['guests'] }}"
      loop_control:
        index_var: idx
        label: "{{ item.name }}"

    - name: Probe bootstrap state inside each guest
      when: item.state | default('present') == 'present'
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ item.vmid }}"
          - --
          - /bin/sh
          - -c
          - >-
            if getent passwd nate >/dev/null 2>&1 && test -f /etc/sudoers.d/nate
            && dpkg -s sudo openssh-server python3 >/dev/null 2>&1;
            then echo BOOTSTRAPPED; else exit 1; fi
            # (getent exits 2 for a missing user -- normalize to 1)
      register: _bs_state
      delegate_to: "{{ item.node }}"   # pct exec works on the CT's OWN node
      until: _bs_state.rc in [0, 1]   # rc=2 while the CT's init is
      retries: 12                     # still booting; retry until it
      delay: 5                        # settles into the real answer
      changed_when: false
      failed_when: _bs_state.rc not in [0, 1]
      loop: "{{ hostvars['localhost']['guests'] }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Stage the operator's key on every node (pct push reads it there)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/keys/admin.ed25519.pub"
        dest: /tmp/homelab-admin.ed25519.pub
        mode: "0644"
      loop: "{{ groups['pve'] }}"
      delegate_to: "{{ item }}"
      loop_control:
        label: "{{ item }}"

    - name: Bootstrap the operator account (console channel, no root ssh)
      when:
        - item.state | default('present') == 'present'
        - not ansible_check_mode   # shell ignores --check; verify
                                    # must stay read-only
        - "'BOOTSTRAPPED' not in _bs_state.results[idx].stdout"
      ansible.builtin.shell: |
        set -eu
        C={{ item.vmid }}
        # packages: sudo (the group), sshd, python3 (ansible)
        pct exec $C -- /usr/bin/env DEBIAN_FRONTEND=noninteractive /usr/bin/apt-get update -qq
        pct exec $C -- /usr/bin/env DEBIAN_FRONTEND=noninteractive /usr/bin/apt-get install -y -qq sudo openssh-server python3
        # the operator's account (getent guard: idempotent)
        if ! pct exec $C -- /usr/bin/getent passwd nate >/dev/null 2>&1; then
          pct exec $C -- /usr/sbin/useradd --create-home --shell /bin/bash nate
          echo CREATED
        fi
        pct exec $C -- /usr/sbin/usermod --append --groups sudo nate
        # the operator's key (canonical copy: playbooks/files/keys/)
        pct exec $C -- /bin/mkdir -p /home/nate/.ssh
        pct push $C /tmp/homelab-admin.ed25519.pub /home/nate/.ssh/authorized_keys
        pct exec $C -- /bin/chown -R nate:nate /home/nate/.ssh
        pct exec $C -- /bin/chmod 0700 /home/nate/.ssh
        pct exec $C -- /bin/chmod 0600 /home/nate/.ssh/authorized_keys
        # passwordless sudo (the node model, issues item 9a)
        pct exec $C -- /bin/sh -c 'printf "nate ALL=(ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/nate'
        pct exec $C -- /bin/chmod 0440 /etc/sudoers.d/nate
        pct exec $C -- /usr/bin/systemctl enable --now ssh
      register: _bootstrap
      delegate_to: "{{ item.node }}"   # pct exec works on the CT's OWN node
      changed_when: "'CREATED' in _bootstrap.stdout or 'BOOTSTRAP' in _bootstrap.stderr"
      loop: "{{ hostvars['localhost']['guests'] }}"
      loop_control:
        index_var: idx
        label: "{{ item.name }}"

    - name: Register guests for in-guest configuration
      when: item.state | default('present') == 'present'
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: homelab_guests
        ansible_host: "{{ item.ip }}"
        ansible_user: nate
        guest_role: "{{ item.role | default(omit) }}"
        tailnet_serve: "{{ item.tailnet_serve | default(omit) }}"   # model B front
      changed_when: false   # structural runtime inventory, not drift
      loop: "{{ hostvars['localhost']['guests'] }}"
      loop_control:
        label: "{{ item.name }}"

- name: Apply common + service roles inside guests
  hosts: homelab_guests
  become: true     # in-CT sudo is passwordless (bootstrap set it)
  gather_facts: true
  vars:
    # fleet addresses for data-driven roles (prometheus targets):
    fleet_nodes: "{{ groups['pve'] | map('extract', hostvars, 'ansible_host') | list }}"
    fleet_guests: "{{ hostvars['localhost']['guests'] }}"
    # this guest's own manifest item (native dict -- task vars keep
    # types, add_host would stringify them)
    manifest_item: "{{ hostvars['localhost']['guests'] | selectattr('name', 'equalto', inventory_hostname) | first }}"
  tasks:
    - name: guest_common (packages, good-ssh, operator account)
      ansible.builtin.include_role:
        name: guest_common

    - name: The manifest's role ({{ guest_role | default('none') }})
      when: guest_role is defined
      ansible.builtin.include_role:
        name: "{{ guest_role }}"
      vars:
        app_container: "{{ manifest_item.container | default({}) }}"
        app_restore: "{{ manifest_item.restore | default({}) }}"
