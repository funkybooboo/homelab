---
# Collections for the v2 IaC skeleton (OPS-7) + the v5 platform refresh
# (OPS-17). Install with:
#   ansible-galaxy collection install -r ansible/requirements.yml
collections:
  - name: community.proxmox    # full PVE lifecycle incl. proxmox_cluster,
                              # LXC/VM, storage, HA rules, inventory
  - name: community.general   # misc (packages, files, cron)
  - name: ansible.posix       # authorized_key + sysctl for guest_common
  - name: oxlorg.opnsense
    # TRAP (2026-11-05 research): each oxlorg release is pinned to ONE
    # OPNsense version; the router runs 25.7. Verify the matching
    # release (latest known: 1.2.16) BEFORE any router-as-code playbook
    # runs -- never upgrade OPNsense ahead of the collection.
