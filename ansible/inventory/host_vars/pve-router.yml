# pve-router -- the Protectli V1210 (plans/issues.md item 1)
ansible_host: 192.168.1.2
arch: amd64
role: pve-node
hardware: Protectli Vault V1210 -- Intel N5105, 4GB LPDDR4 (soldered),
  500GB Kingston NV3 NVMe, coreboot, 2x Intel 2.5GbE
mac: tbd-v1210                       # record both NICs at install (lspci)
constraints:
  - router-only node: the 4GB stays OPNsense's; no other guests
  - never auto-reboots (OPNsense ACPI hang pitfall; notify-only tier)
  - WAN NIC -> vmbr1 (no IP on the node), LAN NIC -> vmbr0
glue:
  - vmbr0/vmbr1 bridges + OPNsense VM (OPS-3, deferred to v5/OPS-17)
