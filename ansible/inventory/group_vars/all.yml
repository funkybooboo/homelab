# group_vars/all.yml -- fleet-wide settings. THE address registry lives
# in host_vars/*.yml (one ansible_host per machine); this file holds
# the LAN-level plan. Consumers: scripts/bootstrap.sh,
# deploy-node-glue.sh, setup-qdevice.sh (bash parsers -- keep the
# top-level key format stable) + the ansible skeleton (OPS-7).
#
# No host is ever DHCP-pinned: infra hosts are static at the OS,
# guests static at pct level (issues item 7); only true clients
# live in the pool.

lan:
  subnet: 192.168.1.0/24
  gateway: 192.168.1.1              # the OPNsense VM on pve-router (OPS-3)
  dns: [192.168.1.1, 1.1.1.1]
  dhcp_pool: [192.168.1.100, 192.168.1.249]   # clients only, never infra

guest_range: [192.168.1.50, 192.168.1.99]     # static guests (v2 manifests)
spare_range: [192.168.1.250, 192.168.1.254]   # printers, bench gear, debug

# reserved future infra guests (assigned in guest manifests when built)
reserved:
  pbs: 192.168.1.12                 # OPS-14 PBS VM
  subnetrouter: 192.168.1.13        # OPS-7 tailscale subnet router

# truenas media exports: mounted on every guest-capable (amd64)
# node at the same path (guest mobility), then bind-mounted into
# CTs via pct mp entries -- no in-CT NFS. ACL notes: movies/
# tvshows/podcasts use mapall root; the home/nate/* sync dirs use
# empty mapall + world-readable default ACLs (keep o::r-x).
media_nfs_server: 192.168.1.10
# NVIDIA driver pin (USER-2): the 580 branch is the LAST series
# supporting the GTX 1060 (Pascal); the .run installer is the only
# remaining source (Debian's 550 cannot build against kernel 7.x;
# NVIDIA's CUDA repo rotated past 580). node_glue installs it on the
# host with --dkms; the jellyfin role installs userspace-only inside
# the CT (--no-kernel-module) -- SAME PIN both places, host module
# and CT libs must never diverge or NVENC fails to initialize.
nvidia_run_version: "580.142"
media_mounts:
  - { name: movies, export: /mnt/volume1/media/movies }
  - { name: tvshows, export: /mnt/volume1/media/tvshows }
  - { name: music, export: /mnt/volume1/home/nate/Music }
  - { name: audiobooks, export: /mnt/volume1/home/nate/Audiobooks }
  - { name: books, export: /mnt/volume1/home/nate/Books }
  - { name: podcasts, export: /mnt/volume1/home/nate/Podcasts }

# --- ansible connection model (v2 skeleton, OPS-7) ---
# Humans operate; assistants help under the same identity. NO root
# login anywhere: ansible connects as the operator's key-only
# account (nate). Escalation is EXPLICIT PER PLAY (become: true on
# the plays that touch nodes/CTs where sudo is passwordless) -- NEVER
# a global ansible_become: inventory vars outrank play keywords, so
# a global become breaks every localhost/debbie task with a sudo
# prompt. The truenas/opnsense appliances are API-driven (no ssh
# escalation) -- see their host_vars.
ansible_user: nate

# PVE API (community.proxmox guest lifecycle): the operator's PVE
# user + a revocable token. The token SECRET lives in
# local/pve-api.env (gitignored). Token id format: <user>!<name>
pve_api_host: 192.168.1.3           # thermaltake's LAN IP: converge must
                                   # not depend on tailscaled (the hostname
                                   # resolves via MagicDNS to the tailnet IP)
pve_api_port: 8006
pve_api_user: nate@pam
pve_api_token_id: nate@pam!homelab-ops
