# hosts.yml -- the fleet. Addresses + facts live in host_vars/*.yml
# (one file per machine); LAN-wide settings in group_vars/all.yml.
all:
  children:
    router:
      hosts:
        opnsense: {}
    pve:
      hosts:
        # pve-router joins here with OPS-3 (v5 re-platform of the
        # V1210); until then the box runs bare-metal OPNsense at .1
        # and is not an ansible target.
        pve-thermaltake: {}
        pve-framework: {}
        pve-aspiree15: {}
        pve-aspires: {}
        # the Pi witness is a FULL PVE member today (zero guests by
        # policy, quorum via membership; the qdevice demotion is the
        # v5 OPS-17 plan). In the pve group so node_glue converges it
        # and fleet_nodes scrapes it -- it ran node_exporter+promtail
        # for 14h pointed at DEAD old-fleet endpoints (wiring, not
        # services; found in the 2026-11-23 three-pillars audit).
        raspberrypi: {}
    storage:
      hosts:
        truenas: {}
    quorum:
      hosts: {}
      # raspberrypi moved INTO pve (2026-11-23): it is a live member
      # and belongs in every group that treats members as a class
      # (scraping, logging, node_glue). Group kept for future
      # quorum-role assignments.
