# hosts.yml -- the fleet. Addresses + facts live in host_vars/*.yml
# (one file per machine); LAN-wide settings in group_vars/all.yml.
all:
  children:
    router:
      hosts:
        opnsense: {}
    pve:
      hosts:
        # pve-router joins here with OPS-3 (v5 re-platform of the
        # V1210); until then the box runs bare-metal OPNsense at .1
        # and is not an ansible target.
        pve-thermaltake: {}
        # TEMPORARILY OUT OF CONVERGE (2026-11-27): framework's USB NIC
        # died with the node up (known quirk, docs/quirks.md); the node
        # is offline until the operator's morning fix. RESTORE THIS LINE
        # when the node answers again, then make converge + make verify.
        # pve-framework: {}
        pve-aspiree15: {}
        pve-aspires: {}
        # the Pi is a FULL PVE member (zero guests by policy, quorum
        # via membership; the qdevice demotion is the v5 OPS-17
        # plan). In the pve group so node_glue converges it and
        # fleet_nodes scrapes it.
        raspberrypi: {}
    storage:
      hosts:
        truenas: {}
    quorum:
      hosts: {}
      # kept for future quorum-role assignments.
