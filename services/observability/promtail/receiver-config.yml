# Promtail config for the receive side on CT 130 (loki tailnet host).
# Deployed to /etc/promtail/config.yml on loki.tail54538d.ts.net.
#
# CT 130's promtail only ingests syslog pushed FROM TrueNAS + the GL-MT2500
# router (the only two hosts without an on-box promtail). The PVE hosts +
# curated CTs each run their own promtail that reads journald + files and
# pushes to http://loki.tail54538d.ts.net:3100 directly -- this config
# forwards only what arrives via syslog to the local Loki.
#
# Syslog listener binds :1514 (high port -- the unprivileged CT cannot
# bind the privileged <1024 range without the CAP_NET_BIND_SERVICE cap;
# TrueNAS + router forward to loki.tail54538d.ts.net:1514).

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  # TrueNAS remote-syslog (System > Advanced > Syslog server).
  # TrueNAS sends RFC5424-ish; the listener parses both 5424 and 3164.
  - job_name: truenas_syslog
    syslog:
      listen_address: 0.0.0.0:1514
      listen_protocol: tcp
      use_incoming_timestamp: true
      labels:
        source: truenas
        job: truenas-syslog
    relabel_configs:
      - source_labels: ["__syslog_message_severity"]
        target_label: severity
      - source_labels: ["__syslog_message_facility"]
        target_label: facility
      - source_labels: ["__syslog_message_app_name"]
        target_label: app

  # Router (GL-MT2500) busybox logread -r loki.tail54538d.ts.net:1515.
  # Uses UDP (fire-and-for-get) -- the tailscale mesh between the router
  # and CT 130 is flaky; TCP syslog fails under packet loss.
  # BusyBox logread sends RFC3164 (BSD syslog -- <pri>Mmm DD HH:MM:SS host prog[pid]: msg)
  # NOT RFC5424. promtail's syslog scraper only supports RFC5424 on UDP;
  # so we use the generic UDP scraper + a regex pipeline to parse manually.
  - job_name: router_syslog
    udp:
      listen_address: 0.0.0.0:1515
      use_incoming_timestamp: false
    labels:
      source: router
      job: router-syslog
    pipeline_stages:
      # RFC3164: <PRI>Mmm DD HH:MM:SS HOSTNAME TAG[PID]: MSG
      # PRI = facility*8 + severity
      - regex:
          expression: '^<(?P<pri>\d+)>(?P<timestamp>\w{3}\s+\d+\s+\d+:\d+:\d+)\s+(?P<host>\S+)\s+(?P<app>\S+?)(?:\[(?P<pid>\d+)\])?:\s*(?P<msg>.*)$'
      - timestamp:
          source: timestamp
          format: 'Jan 02 15:04:05'
          location: UTC
      - labels:
          host:
          app: