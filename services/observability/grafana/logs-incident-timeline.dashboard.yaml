apiVersion: dashboard.grafana.app/v1beta1
kind: Dashboard
metadata:
  name: logs-incident-timeline
  namespace: default
  annotations:
    grafana.app/folder: ""
spec:
  title: "Logs -- Incident Timeline"
  description: "All error/warn journal lines across the homelab, newest first. The one board to look at during an outage. Backed by Loki (https://loki.tail54538d.ts.net)."
  tags: [logs, loki, incident]
  timezone: browser
  schemaVersion: 39
  refresh: 30s
  time: {from: now-1h, to: now}
  editable: true
  templating: {list: []}
  panels:
  - id: 1
    title: "All severity=error|warning journal lines (last 1h)"
    type: logs
    gridPos: {h: 24, w: 24, x: 0, y: 0}
    datasource: {type: loki, uid: loki}
    targets:
    - refId: A
      expr: '{job="systemd-journal"} |= "" | severity=~"error|warning"'
      queryType: instant
      datasource: {type: loki, uid: loki}
    options:
      showTime: true
      showLabels: true
      showCommonLabels: false
      wrapLogMessage: true
      prettifyLogMessage: false
      enableLogDetails: true
      dedupStrategy: none
      sortOrder: "Descending"