apiVersion: dashboard.grafana.app/v1beta1
kind: Dashboard
metadata:
  name: logs-incident-timeline
  namespace: default
  annotations:
    grafana.app/folder: ''
  resourceVersion: '1785550337701986'
spec:
  title: Logs -- Incident Timeline
  description: All error and warning journal lines across every host, newest first. The single board to look at during an outage.
  tags:
  - logs
  - incident
  - error
  timezone: browser
  schemaVersion: 39
  refresh: 30s
  time:
    from: now-6h
    to: now
  editable: true
  graphTooltip: 1
  templating:
    list: []
  panels:
  - id: 1
    title: All severity=error|warning lines (last 1h)
    type: logs
    gridPos:
      h: 24
      w: 24
      x: 0
      y: 0
    datasource:
      type: loki
      uid: loki
    targets:
    - refId: A
      expr: '{job="systemd-journal"} |= "" | severity=~"error|warning"'
      queryType: instant
      datasource:
        type: loki
        uid: loki
    options:
      showTime: true
      showLabels: true
      wrapLogMessage: true
      dedupStrategy: none
      sortOrder: Descending
