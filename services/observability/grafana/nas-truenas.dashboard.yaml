apiVersion: dashboard.grafana.app/v1beta1
kind: Dashboard
metadata:
  name: nas-truenas
  namespace: default
  annotations:
    grafana.app/folder: ''
  resourceVersion: '1785544017664007'
spec:
  title: NAS -- TrueNAS Health
  description: TrueNAS ZFS pools, ARC cache hit rate, disk I/O, filesystem usage, CPU/memory/network.
  tags:
  - nas
  - truenas
  - zfs
  timezone: browser
  schemaVersion: 39
  refresh: 30s
  time:
    from: now-6h
    to: now
  editable: true
  graphTooltip: 1
  templating:
    list: []
  panels:
  - id: 1
    title: ZFS pools online
    type: stat
    gridPos:
      h: 4
      w: 4
      x: 0
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: thresholds
          fixedColor: blue
        thresholds:
          mode: absolute
          steps:
          - color: red
            value: null
          - color: green
            value: 2
        mappings:
        - options:
            '2':
              text: Both ONLINE
              color: green
          type: value
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: count(node_zfs_zpool_state{state="online",instance="truenas.tail54538d.ts.net:9100"} == 1)
      legendFormat: pools
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 2
    title: volume1 used %
    type: gauge
    gridPos:
      h: 4
      w: 4
      x: 4
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        color:
          mode: thresholds
          fixedColor: blue
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
          - color: yellow
            value: 80
          - color: red
            value: 90
    options:
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
    targets:
    - refId: A
      expr: 100 * (1 - node_filesystem_avail_bytes{instance="truenas.tail54538d.ts.net:9100",mountpoint="/mnt/volume1",fstype="zfs"} / node_filesystem_size_bytes{instance="truenas.tail54538d.ts.net:9100",mountpoint="/mnt/volume1",fstype="zfs"})
      legendFormat: volume1
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 3
    title: ARC size
    type: stat
    gridPos:
      h: 4
      w: 4
      x: 8
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: bytes
        color:
          mode: fixed
          fixedColor: blue
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: node_zfs_arc_size{instance="truenas.tail54538d.ts.net:9100"}
      legendFormat: ARC
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 4
    title: ARC hit rate
    type: stat
    gridPos:
      h: 4
      w: 4
      x: 12
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: percentunit
        color:
          mode: fixed
          fixedColor: blue
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: rate(node_zfs_arc_hits_total{instance="truenas.tail54538d.ts.net:9100"}[5m]) / (rate(node_zfs_arc_hits_total{instance="truenas.tail54538d.ts.net:9100"}[5m]) + rate(node_zfs_arc_misses_total{instance="truenas.tail54538d.ts.net:9100"}[5m]))
      legendFormat: hit rate
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 10
    title: CPU %
    type: timeseries
    gridPos:
      h: 8
      w: 14
      x: 0
      y: 4
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: percent
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: 100 * (1 - avg(rate(node_cpu_seconds_total{instance="truenas.tail54538d.ts.net:9100",mode="idle"}[5m])))
      legendFormat: cpu
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 11
    title: Memory used %
    type: timeseries
    gridPos:
      h: 8
      w: 10
      x: 14
      y: 4
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: percent
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: 100 * (1 - node_memory_MemAvailable_bytes{instance="truenas.tail54538d.ts.net:9100"} / node_memory_MemTotal_bytes{instance="truenas.tail54538d.ts.net:9100"})
      legendFormat: mem
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 20
    title: ARC size + hit rate
    type: timeseries
    gridPos:
      h: 8
      w: 12
      x: 0
      y: 12
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: bytes
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: node_zfs_arc_size{instance="truenas.tail54538d.ts.net:9100"}
      legendFormat: ARC size
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 21
    title: ARC hit rate trend
    type: timeseries
    gridPos:
      h: 8
      w: 12
      x: 12
      y: 12
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: percentunit
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: rate(node_zfs_arc_hits_total{instance="truenas.tail54538d.ts.net:9100"}[5m]) / (rate(node_zfs_arc_hits_total{instance="truenas.tail54538d.ts.net:9100"}[5m]) + rate(node_zfs_arc_misses_total{instance="truenas.tail54538d.ts.net:9100"}[5m]))
      legendFormat: hit rate
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 30
    title: Disk I/O bytes/s
    type: timeseries
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 20
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: Bps
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: rate(node_disk_read_bytes_total{instance="truenas.tail54538d.ts.net:9100",device!~"loop.*|ram.*"}[5m])
      legendFormat: '{{device}} read'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 40
    title: Network rx/tx
    type: timeseries
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 28
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: Bps
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: rate(node_network_receive_bytes_total{instance="truenas.tail54538d.ts.net:9100",device!~"lo|veth.*|docker.*|br-.*|tailscale.*|wg.*"}[5m])
      legendFormat: '{{device}} rx'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
