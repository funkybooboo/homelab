apiVersion: dashboard.grafana.app/v1beta1
kind: Dashboard
metadata:
  name: services-overview
  namespace: default
  annotations:
    grafana.app/folder: ''
  resourceVersion: '1785553194742012'
spec:
  title: Proxmox -- CT Resources
  description: 'Per-CT/VM resource use from pve-exporter: CPU, memory, disk, network, IO. Includes allocation summary table.'
  tags:
  - proxmox
  - containers
  - pve-exporter
  timezone: browser
  schemaVersion: 39
  refresh: 30s
  time:
    from: now-6h
    to: now
  editable: true
  graphTooltip: 1
  templating:
    list:
    - name: node
      type: query
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
      query:
        query: label_values(pve_guest_info{template="0"}, node)
        refId: Prometheus-node-Variable-Query
      definition: label_values(pve_guest_info{template="0"}, node)
      multi: true
      includeAll: true
      allValue: .*
      current:
        selected: true
        text: All
        value: $__all
      refresh: 2
      sort: 1
      hide: 0
      allowCustomValue: false
  panels:
  - id: 1
    title: Resource allocation summary
    type: table
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    options:
      showHeader: true
    targets:
    - refId: A
      expr: sum by (id, name, type) (pve_guest_info{template="0"})
      format: table
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 10
    title: Guests CPU usage %
    type: timeseries
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 8
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: percent
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: ((pve_cpu_usage_ratio{instance="raspberrypi.tail54538d.ts.net"} / pve_cpu_usage_limit{instance="raspberrypi.tail54538d.ts.net"}) * on(id, instance) group_left(name, type) pve_guest_info{instance="raspberrypi.tail54538d.ts.net",template="0"})
        and on(id, instance) pve_up{instance="raspberrypi.tail54538d.ts.net"} == 1
      legendFormat: '{{name}}'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 20
    title: Guests memory %
    type: timeseries
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 16
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: percent
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: (pve_memory_usage_bytes{instance="raspberrypi.tail54538d.ts.net"} / pve_memory_size_bytes{instance="raspberrypi.tail54538d.ts.net"} * on(id, instance) group_left(name, type) pve_guest_info{instance="raspberrypi.tail54538d.ts.net",template="0"})
        and on(id, instance) pve_up{instance="raspberrypi.tail54538d.ts.net"} == 1
      legendFormat: '{{name}}'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 30
    title: LXC guests disk usage %
    type: timeseries
    gridPos:
      h: 8
      w: 12
      x: 0
      y: 24
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: percent
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: pve_disk_usage_bytes{instance="raspberrypi.tail54538d.ts.net"} / pve_disk_size_bytes{instance="raspberrypi.tail54538d.ts.net"} * on(id, instance) group_left(name, type) pve_guest_info{instance="raspberrypi.tail54538d.ts.net",type="lxc",template="0"}
      legendFormat: '{{name}}'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 40
    title: Disk IO/s per guest
    type: timeseries
    gridPos:
      h: 8
      w: 12
      x: 12
      y: 24
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: Bps
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: ((rate(pve_disk_write_bytes{instance="raspberrypi.tail54538d.ts.net"}[5m]) + rate(pve_disk_read_bytes{instance="raspberrypi.tail54538d.ts.net"}[5m])) * on(id, instance) group_left(name, type)
        pve_guest_info{instance="raspberrypi.tail54538d.ts.net",template="0"}) and on(id, instance) pve_up{instance="raspberrypi.tail54538d.ts.net"} == 1
      legendFormat: '{{name}}'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 50
    title: Network rx bytes/s per guest
    type: timeseries
    gridPos:
      h: 8
      w: 12
      x: 0
      y: 32
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: Bps
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: (rate(pve_network_receive_bytes{instance="raspberrypi.tail54538d.ts.net"}[5m]) * on(id, instance) group_left(name, type) pve_guest_info{instance="raspberrypi.tail54538d.ts.net",template="0"})
        and on(id, instance) pve_up{instance="raspberrypi.tail54538d.ts.net"} == 1
      legendFormat: '{{name}}'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 60
    title: Network tx bytes/s per guest
    type: timeseries
    gridPos:
      h: 8
      w: 12
      x: 12
      y: 32
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: Bps
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: (rate(pve_network_transmit_bytes{instance="raspberrypi.tail54538d.ts.net"}[5m]) * on(id, instance) group_left(name, type) pve_guest_info{instance="raspberrypi.tail54538d.ts.net",template="0"})
        and on(id, instance) pve_up{instance="raspberrypi.tail54538d.ts.net"} == 1
      legendFormat: '{{name}}'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
