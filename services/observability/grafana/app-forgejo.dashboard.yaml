apiVersion: dashboard.grafana.app/v1beta1
kind: Dashboard
metadata:
  name: app-forgejo
  namespace: default
  annotations:
    grafana.app/folder: ''
  resourceVersion: '1785553198610991'
spec:
  title: App -- Forgejo
  description: 'Forgejo (gitea) self-hosted git: repos, users, issues, orgs, stars, watches, mirrors, milestones, public keys, teams.'
  tags:
  - app
  - forgejo
  - git
  timezone: browser
  schemaVersion: 39
  refresh: 30s
  time:
    from: now-6h
    to: now
  editable: true
  graphTooltip: 1
  templating:
    list: []
  panels:
  - id: 1
    title: Repositories
    type: stat
    gridPos:
      h: 5
      w: 6
      x: 0
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: fixed
          fixedColor: blue
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: gitea_repositories
      legendFormat: repos
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 2
