apiVersion: dashboard.grafana.app/v1beta1
kind: Dashboard
metadata:
  name: logs-pve-ha-narrative
  namespace: default
  annotations:
    grafana.app/folder: ''
  resourceVersion: '1785550342185004'
spec:
  title: Logs -- Proxmox HA Narrative
  description: PVE HA / corosync / HA-manager / LRM + storage (pve-shared NFS, pvesm) journal lines -- the narrative of a failover.
  tags:
  - logs
  - pve
  - ha
  - corosync
  timezone: browser
  schemaVersion: 39
  refresh: 30s
  time:
    from: now-6h
    to: now
  editable: true
  graphTooltip: 1
  templating:
    list: []
  panels:
  - id: 1
    title: corosync + pve-ha-crm + pve-ha-lrm + pvestatd
    type: logs
    gridPos:
      h: 12
      w: 24
      x: 0
      y: 0
    datasource:
      type: loki
      uid: loki
    targets:
    - refId: A
      expr: '{job="systemd-journal",host=~"pve-.*|raspberrypi",unit=~"corosync.service|pve-ha-crm.service|pve-ha-lrm.service|pvestatd.service"}'
      queryType: instant
      datasource:
        type: loki
        uid: loki
    options:
      showTime: true
      showLabels: true
      wrapLogMessage: true
      dedupStrategy: none
      sortOrder: Descending
  - id: 2
    title: pve-shared nfs / pvesm / storage thrash
    type: logs
    gridPos:
      h: 12
      w: 24
      x: 0
      y: 12
    datasource:
      type: loki
      uid: loki
    targets:
    - refId: A
      expr: '{job="systemd-journal",host=~"pve-.*"} |=~ "(?i)(nfs|pvesm|pve-shared|storage|mount).*"'
      queryType: instant
      datasource:
        type: loki
        uid: loki
    options:
      showTime: true
      showLabels: true
      wrapLogMessage: true
      dedupStrategy: none
      sortOrder: Descending
