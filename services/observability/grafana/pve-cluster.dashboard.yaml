apiVersion: dashboard.grafana.app/v1beta1
kind: Dashboard
metadata:
  name: pve-cluster
  namespace: default
  annotations:
    grafana.app/folder: ''
  resourceVersion: '1785553584237988'
spec:
  title: Proxmox -- Cluster Status
  description: 'PVE cluster + per-node status from pve-exporter: quorum, guests, subscription, per-node CPU/memory gauges, storage pools.'
  tags:
  - proxmox
  - cluster
  - pve-exporter
  timezone: browser
  schemaVersion: 39
  refresh: 30s
  time:
    from: now-6h
    to: now
  editable: true
  graphTooltip: 1
  templating:
    list: []
  panels:
  - id: 1
    title: PVE version
    type: stat
    gridPos:
      h: 4
      w: 4
      x: 0
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: fixed
          fixedColor: green
        mappings: []
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: true
      textMode: name
    targets:
    - refId: A
      expr: pve_version_info{instance="raspberrypi.tail54538d.ts.net"}
      legendFormat: '{{version}}'
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 2
    title: Cluster quorum
    type: stat
    gridPos:
      h: 4
      w: 4
      x: 4
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: thresholds
          fixedColor: blue
        thresholds:
          mode: absolute
          steps:
          - color: red
            value: null
          - color: green
            value: 1
        mappings:
        - options:
            '0':
              text: No quorum
              color: red
            '1':
              text: Quorum OK
              color: green
          type: value
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: pve_cluster_info{instance="raspberrypi.tail54538d.ts.net"}
      legendFormat: quorum
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 3
    title: Cluster nodes
    type: stat
    gridPos:
      h: 4
      w: 4
      x: 8
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: fixed
          fixedColor: blue
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: count(pve_node_info{instance="raspberrypi.tail54538d.ts.net"})
      legendFormat: nodes
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 4
    title: Guests running
    type: stat
    gridPos:
      h: 4
      w: 4
      x: 12
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: fixed
          fixedColor: blue
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: count((pve_up{instance="raspberrypi.tail54538d.ts.net"} == 1) * on(id, instance) group_left() pve_guest_info{instance="raspberrypi.tail54538d.ts.net",template="0"})
      legendFormat: guests
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 5
    title: Not backed up
    type: stat
    gridPos:
      h: 4
      w: 4
      x: 16
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: thresholds
          fixedColor: blue
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
          - color: red
            value: 1
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: pve_not_backed_up_total{instance="raspberrypi.tail54538d.ts.net"}
      legendFormat: guests
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 6
    title: Subscription
    type: stat
    gridPos:
      h: 4
      w: 4
      x: 20
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: thresholds
          fixedColor: blue
        thresholds:
          mode: absolute
          steps:
          - color: red
            value: null
          - color: green
            value: 1
        mappings:
        - options:
            '0':
              text: EXPIRED
              color: red
            '1':
              text: Active
              color: green
          type: value
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: pve_subscription_status{instance="raspberrypi.tail54538d.ts.net",status="active"}
      legendFormat: sub
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 10
    title: Per-node CPU % history
    type: timeseries
    gridPos:
      h: 8
      w: 12
      x: 0
      y: 4
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: percent
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: pve_cpu_usage_ratio{instance="raspberrypi.tail54538d.ts.net"} * 100 * on(id) group_left(name) pve_node_info{instance="raspberrypi.tail54538d.ts.net"}
      legendFormat: '{{name}}'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 11
    title: Per-node memory % history
    type: timeseries
    gridPos:
      h: 8
      w: 12
      x: 12
      y: 4
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: percent
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: pve_memory_usage_bytes{instance="raspberrypi.tail54538d.ts.net"} / pve_memory_size_bytes{instance="raspberrypi.tail54538d.ts.net"} * 100 * on(id) group_left(name) pve_node_info{instance="raspberrypi.tail54538d.ts.net"}
      legendFormat: '{{name}}'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 20
    title: Current CPU per node
    type: gauge
    gridPos:
      h: 8
      w: 6
      x: 0
      y: 12
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        color:
          mode: thresholds
          fixedColor: blue
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
          - color: yellow
            value: 80
          - color: red
            value: 90
    options:
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
    targets:
    - refId: A
      expr: pve_cpu_usage_ratio{instance="raspberrypi.tail54538d.ts.net"} * 100 * on(id) group_left(name) pve_node_info{instance="raspberrypi.tail54538d.ts.net"}
      legendFormat: '{{name}}'
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 21
    title: Current memory per node
    type: gauge
    gridPos:
      h: 8
      w: 6
      x: 6
      y: 12
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        color:
          mode: thresholds
          fixedColor: blue
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
          - color: yellow
            value: 80
          - color: red
            value: 90
    options:
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
    targets:
    - refId: A
      expr: pve_memory_usage_bytes{instance="raspberrypi.tail54538d.ts.net"} / pve_memory_size_bytes{instance="raspberrypi.tail54538d.ts.net"} * 100 * on(id) group_left(name) pve_node_info{instance="raspberrypi.tail54538d.ts.net"}
      legendFormat: '{{name}}'
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 30
    title: Storage pool usage %
    type: gauge
    gridPos:
      h: 8
      w: 12
      x: 12
      y: 12
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: percent
        min: 0
        max: 100
        color:
          mode: thresholds
          fixedColor: blue
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
          - color: yellow
            value: 80
          - color: red
            value: 90
    options:
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
    targets:
    - refId: A
      expr: pve_disk_usage_bytes{instance="raspberrypi.tail54538d.ts.net",id=~"storage/.+"} / pve_disk_size_bytes{instance="raspberrypi.tail54538d.ts.net",id=~"storage/.+"} * 100 * on(id, instance) group_left(storage)
        pve_storage_info{instance="raspberrypi.tail54538d.ts.net"}
      legendFormat: '{{storage}}'
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
