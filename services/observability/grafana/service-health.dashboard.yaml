apiVersion: dashboard.grafana.app/v1beta1
kind: Dashboard
metadata:
  name: service-health
  namespace: default
  annotations:
    grafana.app/folder: ''
  resourceVersion: '1785543952847984'
spec:
  title: Network -- Uptime and Certificates
  description: 'Blackbox polling of every tailnet HTTPS endpoint + PVE console + TrueNAS: green/red grid, latency, cert expiry countdown.'
  tags:
  - network
  - uptime
  - blackbox
  - certs
  timezone: browser
  schemaVersion: 39
  refresh: 30s
  time:
    from: now-6h
    to: now
  editable: true
  graphTooltip: 1
  templating:
    list: []
  panels:
  - id: 1
    title: Endpoints up / total
    type: stat
    gridPos:
      h: 4
      w: 5
      x: 0
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: thresholds
          fixedColor: blue
        thresholds:
          mode: absolute
          steps:
          - color: red
            value: null
          - color: green
            value: 27
        mappings:
        - options:
            '27':
              text: 27 / 27 up
              color: green
          type: value
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: count(probe_success{job="blackbox_http"} == 1)
      legendFormat: up
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 2
    title: Endpoints down
    type: stat
    gridPos:
      h: 4
      w: 5
      x: 5
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: thresholds
          fixedColor: blue
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
          - color: red
            value: 1
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: count(probe_success{job="blackbox_http"} == 0)
      legendFormat: down
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 3
    title: Min cert days
    type: stat
    gridPos:
      h: 4
      w: 7
      x: 10
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: thresholds
          fixedColor: blue
        thresholds:
          mode: absolute
          steps:
          - color: red
            value: null
          - color: yellow
            value: 14
          - color: green
            value: 30
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: min(blackbox:cert_days_remaining)
      legendFormat: days
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 4
    title: Certs < 14 days
    type: stat
    gridPos:
      h: 4
      w: 5
      x: 17
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: thresholds
          fixedColor: blue
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
          - color: red
            value: 1
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: count(blackbox:cert_days_remaining < 14)
      legendFormat: certs
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 10
    title: Endpoint status
    type: stat
    gridPos:
      h: 10
      w: 24
      x: 0
      y: 4
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: thresholds
          fixedColor: blue
        thresholds:
          mode: absolute
          steps:
          - color: red
            value: null
          - color: green
            value: 1
        mappings:
        - options:
            '0':
              text: DOWN
              color: red
            '1':
              text: UP
              color: green
          type: value
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: probe_success{job="blackbox_http"}
      legendFormat: '{{instance}}'
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 20
    title: Probe latency per endpoint
    type: timeseries
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 14
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: s
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: probe_duration_seconds{job="blackbox_http"}
      legendFormat: '{{instance}}'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 30
    title: Cert days remaining
    type: bargauge
    gridPos:
      h: 10
      w: 24
      x: 0
      y: 22
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: d
        color:
          mode: thresholds
    options:
      orientation: horizontal
      displayMode: gradient
      showUnfilled: true
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
    targets:
    - refId: A
      expr: blackbox:cert_days_remaining
      legendFormat: '{{instance}}'
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
