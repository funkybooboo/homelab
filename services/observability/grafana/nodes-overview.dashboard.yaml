apiVersion: dashboard.grafana.app/v1beta1
kind: Dashboard
metadata:
  name: nodes-overview
  namespace: default
  annotations:
    grafana.app/folder: ''
  resourceVersion: '1785553192951999'
spec:
  title: Proxmox -- Host Health
  description: 'Per-host OS-level health: CPU, memory, disk, network, load, failed systemd units, temperatures. All 5 PVE hosts via node_exporter.'
  tags:
  - proxmox
  - hosts
  - node-exporter
  timezone: browser
  schemaVersion: 39
  refresh: 30s
  time:
    from: now-6h
    to: now
  editable: true
  graphTooltip: 1
  templating:
    list:
    - name: host
      type: query
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
      query:
        query: label_values(node_uname_info, instance)
        refId: Prometheus-host-Variable-Query
      definition: label_values(node_uname_info, instance)
      multi: true
      includeAll: true
      allValue: .*
      current:
        selected: true
        text: All
        value: $__all
      refresh: 2
      sort: 1
      hide: 0
      allowCustomValue: false
  panels:
  - id: 1
    title: Hosts up
    type: stat
    gridPos:
      h: 4
      w: 4
      x: 0
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: thresholds
          fixedColor: blue
        thresholds:
          mode: absolute
          steps:
          - color: red
            value: null
          - color: green
            value: 5
        mappings:
        - options:
            '0':
              text: DOWN
              color: red
            '1':
              text: up
              color: green
          type: value
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: count(up{job="node"} == 1)
      legendFormat: hosts
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 2
    title: Failed systemd units
    type: stat
    gridPos:
      h: 4
      w: 5
      x: 4
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: thresholds
          fixedColor: blue
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
          - color: yellow
            value: 1
          - color: red
            value: 5
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: sum(count by(instance) (node_systemd_unit_state{state="failed",instance=~"$host"} == 1))
      legendFormat: units
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 3
    title: Min uptime (days)
    type: stat
    gridPos:
      h: 4
      w: 5
      x: 9
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: fixed
          fixedColor: blue
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: min(time() - node_boot_time_seconds{instance=~"$host"}) / 86400
      legendFormat: days
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 4
    title: DiskPressure
    type: stat
    gridPos:
      h: 4
      w: 5
      x: 14
      y: 0
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: thresholds
          fixedColor: blue
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
          - color: red
            value: 1
    options:
      colorMode: value
      graphMode: none
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: value
    targets:
    - refId: A
      expr: max(node_pressure_memory_waiting_seconds_total{instance=~"$host"})
      legendFormat: sec
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 10
    title: CPU usage % per host
    type: timeseries
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 4
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: percent
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: 100 * (1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle",instance=~"$host"}[5m])))
      legendFormat: '{{instance}}'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 11
    title: Memory used % per host
    type: timeseries
    gridPos:
      h: 8
      w: 12
      x: 0
      y: 12
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: percent
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: 100 * (1 - node_memory_MemAvailable_bytes{instance=~"$host"} / node_memory_MemTotal_bytes{instance=~"$host"})
      legendFormat: '{{instance}}'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 12
    title: Load 1/5/15 per host
    type: timeseries
    gridPos:
      h: 8
      w: 12
      x: 12
      y: 12
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: node_load1{instance=~"$host"}
      legendFormat: '{{instance}} load1'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 20
    title: Root filesystem used % per host
    type: timeseries
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 20
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: percent
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/",instance=~"$host",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",instance=~"$host",fstype!~"tmpfs|overlay"})
      legendFormat: '{{instance}}'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 30
    title: Network rx bytes/s per host
    type: timeseries
    gridPos:
      h: 8
      w: 12
      x: 0
      y: 28
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: Bps
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: sum by(instance) (rate(node_network_receive_bytes_total{device!~"lo|veth.*|docker.*|br-.*|tailscale.*|wg.*",instance=~"$host"}[5m]))
      legendFormat: '{{instance}} rx'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 31
    title: Network tx bytes/s per host
    type: timeseries
    gridPos:
      h: 8
      w: 12
      x: 12
      y: 28
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: Bps
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: sum by(instance) (rate(node_network_transmit_bytes_total{device!~"lo|veth.*|docker.*|br-.*|tailscale.*|wg.*",instance=~"$host"}[5m]))
      legendFormat: '{{instance}} tx'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 40
    title: Disk I/O bytes/s per host
    type: timeseries
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 36
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: Bps
        custom:
          drawStyle: line
          lineInterpolation: linear
          fillOpacity: 10
        color:
          mode: palette-classic-by-name
    options:
      legend:
        displayMode: table
        placement: bottom
        showLegend: true
        calcs:
        - lastNotNull
        - max
      tooltip:
        mode: multi
        sort: desc
    targets:
    - refId: A
      expr: sum by(instance) (rate(node_disk_read_bytes_total{device!~"loop.*|ram.*|dm-.*",instance=~"$host"}[5m]) + rate(node_disk_written_bytes_total{device!~"loop.*|ram.*|dm-.*",instance=~"$host"}[5m]))
      legendFormat: '{{instance}}'
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
  - id: 50
    title: Failed systemd units by host
    type: bargauge
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 44
    datasource:
      type: prometheus
      uid: afrtfru117lz4c
    fieldConfig:
      defaults:
        unit: short
        color:
          mode: thresholds
    options:
      orientation: horizontal
      displayMode: gradient
      showUnfilled: true
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
    targets:
    - refId: A
      expr: count by(instance) (node_systemd_unit_state{state="failed",instance=~"$host"} == 1)
      legendFormat: '{{instance}}'
      instant: true
      range: false
      datasource:
        type: prometheus
        uid: afrtfru117lz4c
