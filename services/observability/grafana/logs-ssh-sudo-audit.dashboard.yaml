apiVersion: dashboard.grafana.app/v1beta1
kind: Dashboard
metadata:
  name: logs-ssh-sudo-audit
  namespace: default
  annotations:
    grafana.app/folder: ''
  resourceVersion: '1785553591816020'
spec:
  title: Logs -- SSH and sudo Audit
  description: Successful SSH logins, failed authentications, and sudo invocations across every host in the homelab.
  tags:
  - logs
  - audit
  - ssh
  - sudo
  timezone: browser
  schemaVersion: 39
  refresh: 30s
  time:
    from: now-6h
    to: now
  editable: true
  graphTooltip: 1
  templating:
    list: []
  panels:
  - id: 1
    title: Successful SSH logins (Accepted)
    type: logs
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 0
    datasource:
      type: loki
      uid: loki
    targets:
    - refId: A
      expr: '{job="systemd-journal"} |= "Accepted" |~ "publickey|password|keyboard"'
      queryType: instant
      datasource:
        type: loki
        uid: loki
    options:
      showTime: true
      showLabels: true
      wrapLogMessage: true
      dedupStrategy: none
      sortOrder: Descending
  - id: 2
    title: Failed SSH authentications
    type: logs
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 8
    datasource:
      type: loki
      uid: loki
    targets:
    - refId: A
      expr: '{job="systemd-journal"} |~ "Failed |Invalid user|authentication failure"'
      queryType: instant
      datasource:
        type: loki
        uid: loki
    options:
      showTime: true
      showLabels: true
      wrapLogMessage: true
      dedupStrategy: none
      sortOrder: Descending
  - id: 3
    title: sudo invocations
    type: logs
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 16
    datasource:
      type: loki
      uid: loki
    targets:
    - refId: A
      expr: '{job="systemd-journal"} |~ "sudo:|pam_unix.sudo|COMMAND="}'
      queryType: instant
      datasource:
        type: loki
        uid: loki
    options:
      showTime: true
      showLabels: true
      wrapLogMessage: true
      dedupStrategy: none
      sortOrder: Descending
