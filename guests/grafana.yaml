# grafana.yaml -- dashboards UI; datasources provisioned to
# prometheus (.17) + loki (.19).
name: grafana
vmid: 105
state: present
node: pve-aspires
template: debian-13-standard_13.6-1_amd64.tar.zst
storage: pve-shared
cores: 1
memory: 1024
swap: 512
disk: 8               # grafana's own deb is ~400MB; 4G could not
                       # fit it plus the apt cache
ip: 192.168.1.18
role: grafana
tailnet: true
tailnet_serve: 3000      # https://grafana.tail54538d.ts.net
mounts: []
# nesting: Debian 13 CTs on systemd 257 without it warn on every
# start (and PrivateUsers-style hardening breaks); the manifests'
# features field exists for exactly this
features: [nesting]
